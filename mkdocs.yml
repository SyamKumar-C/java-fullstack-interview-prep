site_name: Java Full-Stack Interview Prep
site_description: A searchable Java full-stack interview preparation knowledge base.
site_url: https://syamkumar-c.github.io/java-fullstack-interview-prep/
repo_url: https://github.com/SyamKumar-C/java-fullstack-interview-prep
repo_name: SyamKumar-C/java-fullstack-interview-prep
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Study Roadmap: study-roadmap.md
  - Interview Answer Format: interview-answer-format.md
  - Topic Template: topic-template.md
  - Topics:
      - Topic Catalogue: topics/index.md
      - Core Java:
          - Overview: topics/core-java.md
          - OOP Principles: topics/core-java/oop-principles.md
          - Classes, Objects & Constructors: topics/core-java/classes-objects-constructors.md
          - Overloading vs Overriding: topics/core-java/overloading-vs-overriding.md
          - Abstract Classes vs Interfaces: topics/core-java/abstract-classes-vs-interfaces.md
          - Interface Default & Static Methods: topics/core-java/interface-default-static-methods.md
          - Access Modifiers & Packages: topics/core-java/access-modifiers-packages.md
          - String Immutability & Pool: topics/core-java/string-immutability-pool.md
          - equals() & hashCode(): topics/core-java/equals-hashcode.md
          - Wrapper Classes & Autoboxing: topics/core-java/wrappers-autoboxing.md
          - Exception Handling: topics/core-java/exception-handling.md
          - Generics: topics/core-java/generics.md
          - Records, Enums & Nested Classes: topics/core-java/records-enums-nested-classes.md
          - OOP Deep Dive: topics/core-java/oop.md
      - Collections: topics/collections.md
      - Streams & Functional Programming: topics/streams-functional.md
      - Concurrency & JVM: topics/concurrency-jvm.md
      - Spring & Spring Boot: topics/spring-boot.md
      - JPA & Hibernate: topics/jpa-hibernate.md
      - SQL & Databases: topics/sql-databases.md
      - REST APIs & Security: topics/rest-security.md
      - Microservices: topics/microservices.md
      - Angular: topics/angular.md
      - JavaScript, TypeScript & RxJS: topics/javascript-typescript-rxjs.md
      - System Design, Cloud & DevOps: topics/system-design-devops.md
