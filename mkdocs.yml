site_name: Java Full-Stack Interview Prep
site_description: A searchable Java full-stack interview preparation knowledge base.
site_url: https://syamkumar-c.github.io/java-fullstack-interview-prep/
repo_url: https://github.com/SyamKumar-C/java-fullstack-interview-prep
repo_name: SyamKumar-C/java-fullstack-interview-prep
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Topics:
      - Core Java: topics/index.md#core-java
      - Collections: topics/index.md#collections
      - Streams & Functional Programming: topics/index.md#streams-and-functional-programming
      - Concurrency & JVM: topics/index.md#concurrency-and-jvm
      - Spring & Spring Boot: topics/index.md#spring-and-spring-boot
      - JPA & Hibernate: topics/index.md#jpa-and-hibernate
      - SQL & Databases: topics/index.md#sql-and-databases
      - REST APIs & Security: topics/index.md#rest-apis-and-security
      - Microservices: topics/index.md#microservices-and-distributed-systems
      - Angular: topics/index.md#angular
      - JavaScript, TypeScript & RxJS: topics/index.md#javascript-typescript-and-rxjs
      - System Design & DevOps: topics/index.md#system-design-cloud-and-devops
