site_name: Java Full-Stack Interview Prep
site_description: A searchable Java full-stack interview preparation knowledge base.
site_url: https://syamkumar-c.github.io/java-fullstack-interview-prep/
repo_url: https://github.com/SyamKumar-C/java-fullstack-interview-prep
repo_name: SyamKumar-C/java-fullstack-interview-prep
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Study Roadmap: study-roadmap.md
  - Interview Answer Format: interview-answer-format.md
  - Topic Template: topic-template.md
